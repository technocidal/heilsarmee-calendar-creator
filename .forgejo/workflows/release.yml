name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: codeberg-medium-lazy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install buildah
        run: |
          apt-get update
          apt-get install -y buildah

      - name: Log in to Codeberg container registry
        run: |
          echo "${{ secrets.CODEBERG_TOKEN }}" | buildah login codeberg.org \
            --username technocidal \
            --password-stdin

      - name: Build and push OCI image
        env:
          STORAGE_DRIVER: vfs
          BUILDAH_ISOLATION: chroot
        run: |
          buildah --storage-driver="$STORAGE_DRIVER" \
            bud --isolation="$BUILDAH_ISOLATION" \
            -t codeberg.org/technocidal/heilsarmee-calendar-creator:latest \
            -t codeberg.org/technocidal/heilsarmee-calendar-creator:${{ github.sha }} \
            .
          buildah --storage-driver="$STORAGE_DRIVER" \
            push codeberg.org/technocidal/heilsarmee-calendar-creator:latest
          buildah --storage-driver="$STORAGE_DRIVER" \
            push codeberg.org/technocidal/heilsarmee-calendar-creator:${{ github.sha }}
